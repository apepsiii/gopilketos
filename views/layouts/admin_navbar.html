{{define "admin_navbar"}}
<header class="bg-white/90 sticky top-0 z-20 backdrop-blur-md border-b border-slate-200/80 px-6 lg:px-8 py-3.5">
    <div class="flex items-center justify-between gap-4">
        <!-- Breadcrumb / Context -->
        <div class="flex items-center gap-2 text-sm">
            <span class="text-slate-400 font-medium">Admin</span>
            <span class="text-slate-300">/</span>
            <span class="text-slate-800 font-bold tracking-tight">{{.PageTitle}}</span>
        </div>

        <!-- Right Quick Actions -->
        <div class="flex items-center gap-3">
            <div
                class="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-emerald-50 border border-emerald-200/60 text-emerald-700 text-xs font-semibold">
                <span class="relative flex h-2 w-2">
                    <span
                        class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
                <span>TPS Aktif</span>
            </div>

            <a href="/scanner" target="_blank"
                class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200/80 text-slate-700 text-xs font-semibold transition-colors duration-150"
                title="Buka bilik suara scanner di tab baru">
                <span class="material-symbols-outlined text-base">open_in_new</span>
                <span class="hidden md:inline">Bilik Suara (Kiosk)</span>
            </a>

            <a href="/" target="_blank"
                class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-semibold transition-colors duration-150"
                title="Buka landing page pemilih">
                <span class="material-symbols-outlined text-base">public</span>
                <span class="hidden md:inline">Landing Page</span>
            </a>
        </div>
    </div>
</header>
{{end}}
