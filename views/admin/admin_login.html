{{define "admin_login.html"}}
<!DOCTYPE html>
<html lang="id" class="h-full">

    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet" />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
            rel="stylesheet" />
        <title>Login Admin | OSIS E-Voting</title>
        <style>
            * {
                font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            }

            .material-symbols-outlined {
                font-family: 'Material Symbols Outlined';
                font-size: 20px;
                line-height: 1;
                font-variation-settings: 'FILL' 0, 'wght' 450, 'GRAD' 0, 'opsz' 24;
                display: inline-block;
                vertical-align: middle;
            }
        </style>
    </head>

    <body class="min-h-full bg-slate-50 flex items-center justify-center p-4 sm:p-6 antialiased">
        <div class="w-full max-w-sm">
            <!-- Logo & Header -->
            <div class="text-center mb-8">
                <div
                    class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-indigo-600 text-white shadow-md shadow-indigo-600/20 mb-3">
                    <span class="material-symbols-outlined text-2xl">how_to_vote</span>
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-slate-900">Admin Portal</h1>
                <p class="text-xs text-slate-500 mt-1">E-Voting Pilketos SMK NIBA Business School</p>
            </div>

            <!-- Login Card -->
            <div class="bg-white rounded-2xl border border-slate-200/80 shadow-xs p-6 sm:p-8">
                {{if .Error}}
                <div
                    class="mb-5 rounded-xl bg-red-50 border border-red-200/80 p-3.5 text-xs font-medium text-red-700 flex items-start gap-2.5">
                    <span class="material-symbols-outlined text-red-500 text-base shrink-0 mt-0.5">error</span>
                    <span>{{.Error}}</span>
                </div>
                {{end}}

                <form method="POST" action="/admin/login" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5"
                            for="username">
                            Username
                        </label>
                        <div class="relative">
                            <span
                                class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-lg">person</span>
                            <input type="text" id="username" name="username" required autofocus
                                placeholder="Masukkan username"
                                class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50/50 text-sm text-slate-900 placeholder:text-slate-400 focus:bg-white focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 focus:outline-none transition-colors" />
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5"
                            for="password">
                            Password
                        </label>
                        <div class="relative">
                            <span
                                class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-lg">lock</span>
                            <input type="password" id="password" name="password" required
                                placeholder="Masukkan kata sandi"
                                class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50/50 text-sm text-slate-900 placeholder:text-slate-400 focus:bg-white focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 focus:outline-none transition-colors" />
                        </div>
                    </div>

                    <div class="pt-2">
                        <button type="submit"
                            class="w-full py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-xs transition-colors duration-150 flex items-center justify-center gap-2">
                            <span>Masuk ke Dashboard</span>
                            <span class="material-symbols-outlined text-base">arrow_forward</span>
                        </button>
                    </div>
                </form>
            </div>

            <!-- Footer Note -->
            <div class="text-center mt-6">
                <a href="/"
                    class="text-xs font-medium text-slate-400 hover:text-indigo-600 transition-colors inline-flex items-center gap-1">
                    <span class="material-symbols-outlined text-sm">arrow_back</span>
                    Kembali ke Beranda Pemilih
                </a>
            </div>
        </div>
    </body>

</html>
{{end}}
